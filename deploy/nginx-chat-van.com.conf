# =====================================================================
# nginx — chat-van.com
# 配置先: /etc/nginx/sites-available/chat-van.com
# 有効化: ln -s /etc/nginx/sites-available/chat-van.com /etc/nginx/sites-enabled/
# SSL:    certbot --nginx -d chat-van.com -d www.chat-van.com
# =====================================================================

# HTTP → HTTPS リダイレクト
server {
    listen 80;
    listen [::]:80;
    server_name chat-van.com www.chat-van.com;

    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://chat-van.com$request_uri; }
}

# www → non-www リダイレクト（HTTPS）
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.chat-van.com;

    ssl_certificate     /etc/letsencrypt/live/chat-van.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/chat-van.com/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://chat-van.com$request_uri;
}

# メインサーバー
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name chat-van.com;

    ssl_certificate     /etc/letsencrypt/live/chat-van.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/chat-van.com/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # --- 静的ファイル（Viteビルド成果物）---
    root  /var/www/chatvan/artifacts/sinjapan/dist/public;
    index index.html;

    # --- API プロキシ（ポート 4820 固定）---
    location /api/ {
        proxy_pass         http://127.0.0.1:4820;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        'upgrade';
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;

        # アップロード上限（書類・画像）
        client_max_body_size 20M;
    }

    # --- SPA フォールバック（React Router）---
    location / {
        try_files $uri $uri/ /index.html;
        expires   -1;           # index.html はキャッシュしない
    }

    # --- 静的アセットの長期キャッシュ ---
    location ~* \.(js|css|woff2?|ttf|eot|svg|png|jpg|jpeg|gif|ico|webp)$ {
        expires    1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # --- セキュリティヘッダー ---
    add_header X-Frame-Options           "SAMEORIGIN"                   always;
    add_header X-Content-Type-Options    "nosniff"                      always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # --- ログ ---
    access_log /var/log/nginx/chat-van.com-access.log;
    error_log  /var/log/nginx/chat-van.com-error.log;
}
