openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.2.0
  description: Chat VAN - 軽バンレンタル相談サービス API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
  - name: auth
  - name: van
    description: Van rental chat & applications
  - name: vehicles
    description: Vehicle management
  - name: rental-companies
    description: Rental company management
  - name: notifications
  - name: users
  - name: payments
  - name: dashboard

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  # ─── Auth ───────────────────────────────────────────────────────────────────
  /auth/login:
    post:
      operationId: login
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginInput"
      responses:
        "200":
          description: Logged in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "401":
          description: Invalid credentials

  /auth/register:
    post:
      operationId: register
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterInput"
      responses:
        "201":
          description: Registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"

  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      responses:
        "200":
          description: Logged out

  /auth/me:
    get:
      operationId: getMe
      tags: [auth]
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          description: Not authenticated

  # ─── Van Chat ───────────────────────────────────────────────────────────────
  /van/start:
    post:
      operationId: startVanChat
      tags: [van]
      summary: Start van rental chat (creates application + conversation)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VanStartInput"
      responses:
        "201":
          description: Chat started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VanStartResponse"

  /van/applications:
    get:
      operationId: listVanApplications
      tags: [van]
      summary: List van applications (admin)
      parameters:
        - name: status
          in: query
          schema:
            type: ["string", "null"]
        - name: page
          in: query
          schema:
            type: ["integer", "null"]
        - name: limit
          in: query
          schema:
            type: ["integer", "null"]
      responses:
        "200":
          description: List of applications
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VanApplicationList"

  /van/applications/{id}:
    get:
      operationId: getVanApplication
      tags: [van]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Application
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VanApplication"
        "404":
          description: Not found
    patch:
      operationId: updateVanApplication
      tags: [van]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VanApplicationUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VanApplication"

  /van/applications/{id}/messages:
    get:
      operationId: listVanMessages
      tags: [van]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Messages
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/VanMessage"
    post:
      operationId: sendVanMessage
      tags: [van]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VanMessageInput"
      responses:
        "200":
          description: AI response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VanChatResponse"

  /van/applications/{id}/propose:
    post:
      operationId: sendVanProposal
      tags: [van]
      summary: Admin sends vehicle proposal to user
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VanProposalInput"
      responses:
        "200":
          description: Proposal sent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VanApplication"

  /van/applications/{id}/accept:
    post:
      operationId: acceptVanProposal
      tags: [van]
      summary: User accepts a vehicle proposal
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VanAcceptInput"
      responses:
        "200":
          description: Application updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VanApplication"

  # ─── Dashboard ──────────────────────────────────────────────────────────────
  /van/dashboard:
    get:
      operationId: getVanDashboard
      tags: [dashboard]
      summary: Admin dashboard stats
      responses:
        "200":
          description: Stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VanDashboardStats"

  # ─── Contracts ──────────────────────────────────────────────────────────────
  /van/contracts:
    get:
      operationId: listVanContracts
      tags: [van]
      parameters:
        - name: userId
          in: query
          schema:
            type: ["integer", "null"]
        - name: status
          in: query
          schema:
            type: ["string", "null"]
      responses:
        "200":
          description: Contracts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/VanContract"

  /van/contracts/{id}:
    get:
      operationId: getVanContract
      tags: [van]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Contract
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VanContract"
    patch:
      operationId: updateVanContract
      tags: [van]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VanContractUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VanContract"

  # ─── Rental Companies ────────────────────────────────────────────────────────
  /van/rental-companies:
    get:
      operationId: listRentalCompanies
      tags: [rental-companies]
      responses:
        "200":
          description: List
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RentalCompany"
    post:
      operationId: createRentalCompany
      tags: [rental-companies]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RentalCompanyInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RentalCompany"

  /van/rental-companies/{id}:
    get:
      operationId: getRentalCompany
      tags: [rental-companies]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Rental company
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RentalCompany"
    patch:
      operationId: updateRentalCompany
      tags: [rental-companies]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RentalCompanyUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RentalCompany"
    delete:
      operationId: deleteRentalCompany
      tags: [rental-companies]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  # ─── Vehicles ────────────────────────────────────────────────────────────────
  /van/vehicles:
    get:
      operationId: listVehicles
      tags: [vehicles]
      parameters:
        - name: status
          in: query
          schema:
            type: ["string", "null"]
        - name: prefecture
          in: query
          schema:
            type: ["string", "null"]
        - name: rentalCompanyId
          in: query
          schema:
            type: ["integer", "null"]
      responses:
        "200":
          description: Vehicles
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Vehicle"
    post:
      operationId: createVehicle
      tags: [vehicles]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VehicleInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Vehicle"

  /van/vehicles/{id}:
    get:
      operationId: getVehicle
      tags: [vehicles]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Vehicle
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Vehicle"
    patch:
      operationId: updateVehicle
      tags: [vehicles]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VehicleUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Vehicle"
    delete:
      operationId: deleteVehicle
      tags: [vehicles]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  # ─── Notifications ───────────────────────────────────────────────────────────
  /notifications:
    get:
      operationId: listNotifications
      tags: [notifications]
      responses:
        "200":
          description: Notifications
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Notification"

  /notifications/{id}/read:
    patch:
      operationId: markNotificationRead
      tags: [notifications]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Marked as read

  # ─── Users ───────────────────────────────────────────────────────────────────
  /users:
    get:
      operationId: listUsers
      tags: [users]
      responses:
        "200":
          description: Users
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/User"

  /users/{id}:
    get:
      operationId: getUser
      tags: [users]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: User
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
    patch:
      operationId: updateUser
      tags: [users]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"

  # ─── Contract Chat ──────────────────────────────────────────────────────────
  /contract-chat/{contractId}:
    get:
      operationId: listContractMessages
      tags: [van]
      summary: Get contract chat messages (marks unread as read)
      parameters:
        - name: contractId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Messages
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ContractMessage"
        "401":
          description: Not authenticated
        "403":
          description: Access denied
    post:
      operationId: sendContractMessage
      tags: [van]
      summary: Send a contract chat message
      parameters:
        - name: contractId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ContractMessageInput"
      responses:
        "201":
          description: Message sent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContractMessage"
        "400":
          description: Bad request
        "401":
          description: Not authenticated
        "403":
          description: Access denied

  /contract-chat/{contractId}/unread:
    get:
      operationId: getContractUnreadCount
      tags: [van]
      summary: Get unread message count for a contract chat
      parameters:
        - name: contractId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Unread count
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContractUnreadCount"
        "401":
          description: Not authenticated

  # ─── Payments ────────────────────────────────────────────────────────────────
  /payments:
    get:
      operationId: listPayments
      tags: [payments]
      parameters:
        - name: userId
          in: query
          schema:
            type: ["integer", "null"]
      responses:
        "200":
          description: Payments
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Payment"
    post:
      operationId: createPayment
      tags: [payments]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PaymentInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Payment"

  /payments/{id}:
    get:
      operationId: getPayment
      tags: [payments]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Payment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Payment"

components:
  schemas:
    HealthStatus:
      type: object
      required: [status]
      properties:
        status:
          type: string

    # ─── Auth ────────────────────────────────────────────────────────────────
    LoginInput:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
        password:
          type: string

    RegisterInput:
      type: object
      required: [email, password, name]
      properties:
        email:
          type: string
        password:
          type: string
        name:
          type: string
        phone:
          type: string

    AuthResponse:
      type: object
      required: [user]
      properties:
        user:
          $ref: "#/components/schemas/User"
        token:
          type: ["string", "null"]

    User:
      type: object
      required: [id, email, name, role]
      properties:
        id:
          type: integer
        email:
          type: string
        name:
          type: string
        phone:
          type: ["string", "null"]
        role:
          type: string
        createdAt:
          type: string

    UserUpdate:
      type: object
      properties:
        name:
          type: string
        phone:
          type: string
        email:
          type: string

    # ─── Van Application ─────────────────────────────────────────────────────
    VanStartInput:
      type: object
      required: [message]
      properties:
        message:
          type: string

    VanStartResponse:
      type: object
      required: [applicationId, conversationId]
      properties:
        applicationId:
          type: integer
        conversationId:
          type: integer
        aiMessage:
          type: string

    VanApplication:
      type: object
      required: [id, status, createdAt]
      properties:
        id:
          type: integer
        userId:
          type: ["integer", "null"]
        conversationId:
          type: ["integer", "null"]
        status:
          type: string
        area:
          type: ["string", "null"]
        startDate:
          type: ["string", "null"]
        monthlyBudget:
          type: ["integer", "null"]
        vehiclePreference:
          type: ["string", "null"]
        purpose:
          type: ["string", "null"]
        durationMonths:
          type: ["integer", "null"]
        insuranceStatus:
          type: ["string", "null"]
        hasBlackNumber:
          type: ["boolean", "null"]
        hasDeliveryExperience:
          type: ["boolean", "null"]
        applicantName:
          type: ["string", "null"]
        phone:
          type: ["string", "null"]
        email:
          type: ["string", "null"]
        dob:
          type: ["string", "null"]
        address:
          type: ["string", "null"]
        requestText:
          type: ["string", "null"]
        adminNotes:
          type: ["string", "null"]
        proposedVehicles:
          type: ["array", "null"]
          items:
            $ref: "#/components/schemas/Vehicle"
        createdAt:
          type: string
        updatedAt:
          type: string

    VanApplicationUpdate:
      type: object
      properties:
        status:
          type: string
        area:
          type: string
        startDate:
          type: string
        monthlyBudget:
          type: integer
        purpose:
          type: string
        durationMonths:
          type: integer
        insuranceStatus:
          type: string
        hasBlackNumber:
          type: boolean
        hasDeliveryExperience:
          type: boolean
        applicantName:
          type: string
        phone:
          type: string
        email:
          type: string
        dob:
          type: string
        address:
          type: string
        adminNotes:
          type: string

    VanApplicationList:
      type: object
      required: [applications, total]
      properties:
        applications:
          type: array
          items:
            $ref: "#/components/schemas/VanApplication"
        total:
          type: integer

    VanMessage:
      type: object
      required: [id, role, content, createdAt]
      properties:
        id:
          type: integer
        role:
          type: string
        content:
          type: string
        options:
          type: ["array", "null"]
          items:
            type: string
        createdAt:
          type: string

    VanMessageInput:
      type: object
      required: [message]
      properties:
        message:
          type: string

    VanChatResponse:
      type: object
      required: [message, isComplete]
      properties:
        message:
          type: string
        options:
          type: ["array", "null"]
          items:
            type: string
        isComplete:
          type: boolean
        inquiry:
          type: ["object", "null"]

    VanProposalInput:
      type: object
      required: [vehicleIds]
      properties:
        vehicleIds:
          type: array
          items:
            type: integer
        message:
          type: string

    VanAcceptInput:
      type: object
      required: [vehicleId]
      properties:
        vehicleId:
          type: integer

    VanDashboardStats:
      type: object
      required: [newConsultations, pendingReview, proposalSent, activeApplications, activeContracts, returningSoon, totalRevenue]
      properties:
        newConsultations:
          type: integer
        pendingReview:
          type: integer
        proposalSent:
          type: integer
        activeApplications:
          type: integer
        activeContracts:
          type: integer
        returningSoon:
          type: integer
        totalRevenue:
          type: number
        thisMonthRevenue:
          type: number
        totalVehicles:
          type: integer
        availableVehicles:
          type: integer

    VanContract:
      type: object
      required: [id, userId, vehicleId, status, monthlyPrice, createdAt]
      properties:
        id:
          type: integer
        applicationId:
          type: ["integer", "null"]
        userId:
          type: integer
        vehicleId:
          type: integer
        startDate:
          type: ["string", "null"]
        endDate:
          type: ["string", "null"]
        monthlyPrice:
          type: number
        sinJapanFee:
          type: number
        paymentDay:
          type: integer
        status:
          type: string
        notes:
          type: ["string", "null"]
        vehicle:
          $ref: "#/components/schemas/Vehicle"
        createdAt:
          type: string

    VanContractUpdate:
      type: object
      properties:
        status:
          type: string
        startDate:
          type: string
        endDate:
          type: string
        notes:
          type: string

    # ─── Rental Company ───────────────────────────────────────────────────────
    RentalCompany:
      type: object
      required: [id, name, createdAt]
      properties:
        id:
          type: integer
        name:
          type: string
        contactName:
          type: ["string", "null"]
        phone:
          type: ["string", "null"]
        email:
          type: ["string", "null"]
        address:
          type: ["string", "null"]
        serviceArea:
          type: ["string", "null"]
        paymentInfo:
          type: ["string", "null"]
        notes:
          type: ["string", "null"]
        vehicleCount:
          type: ["integer", "null"]
        createdAt:
          type: string

    RentalCompanyInput:
      type: object
      required: [name]
      properties:
        name:
          type: string
        contactName:
          type: string
        phone:
          type: string
        email:
          type: string
        address:
          type: string
        serviceArea:
          type: string
        paymentInfo:
          type: string
        notes:
          type: string

    RentalCompanyUpdate:
      type: object
      properties:
        name:
          type: string
        contactName:
          type: string
        phone:
          type: string
        email:
          type: string
        address:
          type: string
        serviceArea:
          type: string
        paymentInfo:
          type: string
        notes:
          type: string

    # ─── Vehicle ──────────────────────────────────────────────────────────────
    Vehicle:
      type: object
      required: [id, maker, model, monthlyPrice, status, createdAt]
      properties:
        id:
          type: integer
        rentalCompanyId:
          type: ["integer", "null"]
        maker:
          type: string
        model:
          type: string
        year:
          type: ["integer", "null"]
        mileage:
          type: ["integer", "null"]
        inspectionExpiry:
          type: ["string", "null"]
        prefecture:
          type: ["string", "null"]
        locationDetail:
          type: ["string", "null"]
        monthlyPrice:
          type: number
        sinJapanFee:
          type: number
        insuranceFee:
          type: number
        userPrice:
          type: ["number", "null"]
        minPeriodMonths:
          type: integer
        availableFrom:
          type: ["string", "null"]
        hasEtc:
          type: boolean
        hasDashcam:
          type: boolean
        hasBackupCam:
          type: boolean
        photos:
          type: ["string", "null"]
        notes:
          type: ["string", "null"]
        status:
